<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>LMU Dashboard</title>
    <meta name="description" content="Unofficial customizable dashboard for LMU students.">
    <meta name="theme-color" content="#00883A">
    <meta name="color-scheme" content="light dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="LMU">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="./assets/icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="./assets/icons/favicon-16.png" sizes="16x16" type="image/png">
    <link rel="shortcut icon" href="./assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="mask-icon" href="./assets/icons/favicon.svg" color="#00883A">
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="./app.css">
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="launch-screen" id="launchScreen" aria-hidden="true">
      <img src="./assets/icons/icon-192.png" width="72" height="72" alt="">
      <strong>LMU Dashboard</strong>
    </div>

    <header class="topbar" id="topbar"></header>

    <main id="app" class="app-shell" tabindex="-1"></main>

    <dialog class="settings-dialog" id="settingsDialog" aria-labelledby="settingsTitle"></dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
